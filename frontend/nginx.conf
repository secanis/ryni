# `map` lives in the http context (this file is included from http{}).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Edge rate-limit for the anonymous ingest (defense-in-depth on top of
# PocketBase's built-in limiter, which is the authoritative one). Auth
# endpoints are rate-limited by PB itself (see pb_migrations/*rate_limits*),
# which resolves the real client IP via trustedProxy — keying auth limits here
# would mis-key behind a reverse proxy. Here nginx IS the edge, so
# $binary_remote_addr is the real client IP.
limit_req_zone $binary_remote_addr zone=ryni_ingest:10m rate=240r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 500m;
    proxy_request_buffering off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # Never cache the SPA entrypoint; always cache hashed assets.
    location = /index.html {
        expires epoch;
    }

    # Runtime config generated at container start from PB_URL.
    location = /config.js {
        root /tmp/ryni;
        expires epoch;
        try_files /config.js @default_config;
    }
    location @default_config {
        expires epoch;
        try_files /config.js =404;
    }

    # The tracker script is a static asset served from /ryni.js (Variant A).
    location = /ryni.js {
        expires epoch;
        try_files $uri =404;
    }

    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Anonymous tracking ingest (Variant A: POST /t/{slug}).
    # The ingest only ever reads a 64 KB body — cap it here so the anonymous
    # endpoint can't be used to stream huge request bodies (DoS).
    location /t/ {
        client_max_body_size 64k;
        proxy_request_buffering on;
        limit_req zone=ryni_ingest burst=500 nodelay;
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PocketBase realtime (SSE) — long-lived, unbuffered responses.
    location /api/realtime {
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # PocketBase superuser UI + OAuth2 redirect pages
    location /_ {
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
