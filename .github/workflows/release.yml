# SPDX-License-Identifier: AGPL-3.0-or-later
# Release for RÝNI — runs on push of tags matching v* (e.g. v0.1.0).
#
# Job graph:
#
#   resolve ─── validates the tag (push or workflow_dispatch input)
#       │
#   test ─── the full CI suite (ci.yml via workflow_call) at that tag
#       │
#   build-images ─── multi-arch (linux/amd64 + linux/arm64), pushed to Docker Hub
#       │
#       ├──> bootstrap-gh-pages (parallel) ─── creates orphan branch if absent
#       │        │
#       │        └──> release-helm ─── packages chart, updates index.yaml
#       │                              (helm repo on gh-pages), commits a
#       │                              Pages marker commit on main
#       │              └──> publish-site ─── dispatches pages.yml on main and
#       │                                     waits (fresh GITHUB_SHA = new
#       │                                     Pages build version)
#       │
#       └──> notify-artifacthub
#
# Required secrets:
#   - DOCKERHUB_USERNAME   Docker Hub username
#   - DOCKERHUB_TOKEN      Docker Hub access token (NOT the account password)
#
# Optional (for manual releases): dispatch this workflow on the EXISTING
# vX.Y.Z tag ("Use workflow from" → the tag). No tag input exists, so the
# ref that is tested, built and released is always the ref GitHub checked
# out — a workflow input can never point the build at code that the tag
# does not contain.
#
# Security: inputs / event data never appear inside `run:` scripts as
# ${{ }} expressions (script injection); they are passed via `env:` and
# the tag is validated against a strict semver pattern in `resolve`.
# Actions are pinned to commit SHAs (version in the trailing comment).

name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual (re-)release: dispatch on the vX.Y.Z tag ref itself. The tag is
  # resolved from github.ref_name, never from an input.
  workflow_dispatch:

# Don't cancel an in-progress release mid-flight
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: read-only by default, write only on the jobs that push
# to the gh-pages branch / create the chart release. Docker Hub uses its
# own token, gh-pages is pushed with git (no Pages / OIDC API).
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # 0. Resolve + validate the release tag once; every other job uses the
  # outputs (never the raw ref directly).
  # -------------------------------------------------------------------------
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      chart_version: ${{ steps.version.outputs.chart_version }}
    steps:
      - name: Resolve release tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Release must run on a tag. Re-run the workflow with 'Use workflow from' set to the vX.Y.Z tag."
            exit 1
          fi
          TAG="$REF_NAME"
          if [ -z "$TAG" ]; then
            echo "::error::No tag resolved. Push a v* tag or dispatch the workflow on that tag."
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag '$TAG' is not a valid release tag (expected vX.Y.Z or vX.Y.Z-pre)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "chart_version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # 0b. Full test suite at the release tag. Nothing is published unless it
  # passes. ci.yml has no ref input: it tests the caller's ref, which is the
  # tag this workflow runs on.
  # -------------------------------------------------------------------------
  test:
    name: Test
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # -------------------------------------------------------------------------
  # 1. Build and push multi-arch images to Docker Hub (public, for distribution)
  # -------------------------------------------------------------------------
  build-images:
    name: Build and push image (${{ matrix.name }})
    needs: [resolve, test]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pocketbase
            context: pocketbase
            dockerfile: pocketbase/Dockerfile
            registry: docker.io/secanis/ryni-pocketbase
            repo: secanis/ryni-pocketbase
            readme: docker/pocketbase.md
            short_description: RÝNI backend — PocketBase v0.40 with RÝNI hooks and migrations.
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            registry: docker.io/secanis/ryni-frontend
            repo: secanis/ryni-frontend
            readme: docker/frontend.md
            short_description: RÝNI frontend — SolidJS SPA served by nginx-unprivileged, pairs with ryni-pocketbase.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      # QEMU for the linux/arm64 leg of the multi-arch build.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ matrix.registry }}
          tags: |
            # The exact tag (e.g. v0.1.0)
            type=raw,value=${{ needs.resolve.outputs.tag }}
            # Semver expansion: 0.1.0, 0.1, 0
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.resolve.outputs.tag }}
            # latest on main only
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: latest=auto
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max
          # Stamp the release tag and commit into the images. The frontend
          # bakes both into the bundle (About page); PocketBase only uses
          # RYNI_VERSION as an env var, and declares RYNI_COMMIT so the
          # shared build-args block stays warning-free.
          build-args: |
            RYNI_VERSION=${{ needs.resolve.outputs.tag }}
            RYNI_COMMIT=${{ github.sha }}
      # Sync the Docker Hub repo description + README (best-effort).
      - name: Sync Docker Hub description
        if: success()
        continue-on-error: true
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ matrix.repo }}
          readme-filepath: ${{ matrix.readme }}
          short-description: ${{ matrix.short_description }}

      # Docker Hub auto-creates repos as PRIVATE on first push, which breaks
      # anonymous pulls (and Artifact Hub scanning). Flip it public.
      # Best-effort: the PAT must have Admin scope on the namespace.
      - name: Make Docker Hub repo public
        if: success()
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO: ${{ matrix.repo }}
        run: |
          JWT="$(curl -fsS https://hub.docker.com/v2/auth/token \
            -H 'Content-Type: application/json' \
            -d "{\"identifier\":\"${DOCKERHUB_USERNAME}\",\"secret\":\"${DOCKERHUB_TOKEN}\"}" \
            | jq -r '.access_token')"
          echo "JWT acquired (${#JWT} chars)"
          RESP="$(curl -sS -w '\n%{http_code}' -X PATCH \
            "https://hub.docker.com/v2/repositories/${REPO}/" \
            -H "Authorization: Bearer ${JWT}" \
            -H 'Content-Type: application/json' \
            -d '{"is_private": false}')"
          echo "PATCH ${REPO} -> ${RESP}"

  # -------------------------------------------------------------------------
  # 2. Bootstrap the gh-pages branch (orphan + empty commit) so the
  # index.yaml push step has somewhere to push on a fresh repo.
  # -------------------------------------------------------------------------
  bootstrap-gh-pages:
    name: Bootstrap gh-pages branch
    needs: build-images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Ensure gh-pages branch exists on origin
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            echo "gh-pages already exists on origin — nothing to bootstrap"
            exit 0
          fi
          echo "gh-pages missing on origin — bootstrapping with an empty commit"
          git worktree add --detach /tmp/gh-pages-bootstrap
          git -C /tmp/gh-pages-bootstrap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C /tmp/gh-pages-bootstrap config user.name  "github-actions[bot]"
          git -C /tmp/gh-pages-bootstrap rm -rfq .
          git -C /tmp/gh-pages-bootstrap checkout --orphan gh-pages
          git -C /tmp/gh-pages-bootstrap commit --allow-empty -m "chore: bootstrap gh-pages for helm repo"
          git -C /tmp/gh-pages-bootstrap push origin gh-pages
          git -C /tmp/gh-pages-bootstrap checkout --detach
          git worktree remove --force /tmp/gh-pages-bootstrap

  # -------------------------------------------------------------------------
  # 3. Package and publish the helm chart
  # Packages helm/ryni/ as a .tgz and attaches it to the release the tag
  # points at, then regenerates index.yaml on gh-pages so `helm install`
  # finds the chart.
  # -------------------------------------------------------------------------
  release-helm:
    name: Package and publish helm chart
    needs: [resolve, build-images, bootstrap-gh-pages]
    runs-on: ubuntu-24.04
    outputs:
      # SHA of the marker commit pushed to main after gh-pages was updated.
      # publish-site dispatches pages.yml on main so that commit becomes the
      # Pages build version (see the job comment below).
      pages_commit: ${{ steps.pages_commit.outputs.oid }}
    permissions:
      # Uploads the .tgz to the existing release and pushes index.yaml to
      # gh-pages.
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.2.2
      - name: Update Chart.yaml (version + appVersion)
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          CHART_VERSION: ${{ needs.resolve.outputs.chart_version }}
        run: |
          sed -i "s/^version: .*/version: $CHART_VERSION/" helm/ryni/Chart.yaml
          sed -i "s/^appVersion: \".*\"/appVersion: \"$TAG\"/" helm/ryni/Chart.yaml
          # Also sync values.yaml so `helm install` (without overrides) pulls
          # the right images for this release.
          sed -i "s|^\(\s*tag:\s*\).*|\1$TAG|" helm/ryni/values.yaml
          echo "Updated Chart.yaml:"
          grep -E "^(version|appVersion):" helm/ryni/Chart.yaml
          echo "Updated image tags in values.yaml:"
          grep -E "tag:" helm/ryni/values.yaml
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Package chart
        env:
          CHART_VERSION: ${{ needs.resolve.outputs.chart_version }}
        run: |
          mkdir -p .cr-release-packages
          helm package helm/ryni --destination .cr-release-packages
          ls -la .cr-release-packages
          test -f ".cr-release-packages/ryni-${CHART_VERSION}.tgz"
      - name: Attach chart package to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          CHART_VERSION: ${{ needs.resolve.outputs.chart_version }}
        run: |
          TGZ=".cr-release-packages/ryni-${CHART_VERSION}.tgz"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist yet — creating it"
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" "$TGZ" --clobber
          echo "Uploaded $TGZ to release $TAG"
      - name: Update Helm index on gh-pages
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          CHART_VERSION: ${{ needs.resolve.outputs.chart_version }}
        run: |
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir -p /tmp/newchart
          cp ".cr-release-packages/ryni-${CHART_VERSION}.tgz" /tmp/newchart/
          git worktree add -B gh-pages /tmp/gh-pages-index origin/gh-pages
          helm repo index /tmp/newchart --url "$REPO_URL" --merge /tmp/gh-pages-index/index.yaml
          cp /tmp/newchart/index.yaml /tmp/gh-pages-index/index.yaml
          # Artifact Hub reads artifacthub-repo.yaml from the helm repo root.
          cp -v artifacthub-repo.yaml /tmp/gh-pages-index/artifacthub-repo.yaml || true
          cd /tmp/gh-pages-index
          # Stage first: a freshly-generated index.yaml is untracked, and
          # `git diff` ignores untracked files — diffing before staging would
          # skip the first publish entirely.
          git add index.yaml artifacthub-repo.yaml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: publish chart $CHART_VERSION (release $TAG)"
            git push origin gh-pages
          else
            echo "index.yaml unchanged"
          fi
          git worktree remove --force /tmp/gh-pages-index

      # GitHub Pages keys a deployment by the workflow run's GITHUB_SHA
      # (deploy-pages sends it as pages_build_version). Re-dispatching a run
      # with a SHA that was already deployed keeps serving the old artifact.
      # Commit a marker file on main so publish-site has a brand-new commit to
      # dispatch pages.yml against. The marker content is irrelevant; it only
      # has to differ from the previous release.
      - name: Create Pages deploy commit
        id: pages_commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          CHART_VERSION: ${{ needs.resolve.outputs.chart_version }}
        run: |
          HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          CONTENT="$(printf '{"chart":"ryni","version":"%s","appVersion":"%s"}\n' "$CHART_VERSION" "$TAG" | base64 -w0)"
          cat > /tmp/pages-commit.json <<EOF
          {"query":"mutation(\$input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: \$input) { commit { oid } } }","variables":{"input":{"branch":{"repositoryNameWithOwner":"${GITHUB_REPOSITORY}","branchName":"main"},"message":{"headline":"chore(site): chart version $CHART_VERSION"},"fileChanges":{"additions":[{"path":"site/public/chart-version-${CHART_VERSION}.json","contents":"$CONTENT"}]},"expectedHeadOid":"$HEAD"}}}
          EOF
          OID="$(gh api graphql --input /tmp/pages-commit.json --jq '.data.createCommitOnBranch.commit.oid')"
          echo "Pages marker commit: $OID"
          echo "oid=$OID" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # 4. Publish the landing page + Helm repo to GitHub Pages via pages.yml.
  #
  # This MUST be its own workflow run on main, not a reusable-workflow call:
  # inside a called workflow github.sha stays the caller's SHA (the release
  # tag's commit). deploy-pages uses GITHUB_SHA as pages_build_version, so the
  # call re-used the build version of the last push to main and Pages kept
  # serving its old artifact — the live index.yaml stayed at the previous
  # chart version even though gh-pages was updated. Dispatching pages.yml on
  # main gives it release-helm's fresh marker commit as GITHUB_SHA, so Pages
  # deploys a new artifact (and pages.yml's verify job checks index.yaml).
  # (workflow_dispatch is the one event a GITHUB_TOKEN-authored commit can
  # still trigger.)
  # -------------------------------------------------------------------------
  publish-site:
    name: Publish site to GitHub Pages
    needs: [resolve, release-helm]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch Pages workflow on main and wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_COMMIT: ${{ needs.release-helm.outputs.pages_commit }}
        run: |
          if [ -z "$PAGES_COMMIT" ]; then
            echo "::error::release-helm did not report the Pages marker commit"
            exit 1
          fi
          # Run ids increase monotonically: remember the newest Pages dispatch
          # before triggering, then wait for a newer one to appear.
          BEFORE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml \
            --event workflow_dispatch --limit 1 --json databaseId \
            -q '.[0].databaseId // 0')"
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml \
              --event workflow_dispatch --limit 1 --json databaseId \
              -q '.[0].databaseId // 0')"
            if [ "$RUN_ID" -gt "$BEFORE" ]; then
              break
            fi
            RUN_ID=""
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::pages.yml was not queued on main"
            exit 1
          fi
          echo "Watching Pages run ${RUN_ID} (main @ ${PAGES_COMMIT})"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

  # -------------------------------------------------------------------------
  # 5. Notify artifacthub.io (optional, best-effort)
  # -------------------------------------------------------------------------
  notify-artifacthub:
    name: Trigger Artifact Hub re-index (optional)
    runs-on: ubuntu-24.04
    needs: publish-site
    if: success()
    continue-on-error: true
    permissions: {}
    steps:
      - name: Ping Artifact Hub
        run: |
          REPO="https://ryni.secanis.ch/"
          echo "Notifying Artifact Hub to re-index $REPO"
          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            "https://artifacthub.io/api/v1/repositories/reindex" \
            -d "{\"url\":\"$REPO\"}" || true
