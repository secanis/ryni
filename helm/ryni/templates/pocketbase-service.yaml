apiVersion: v1
kind: Service
metadata:
  name: {{ include "ryni.pocketbase.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "ryni.labels" . | nindent 4 }}
    app.kubernetes.io/component: pocketbase
spec:
  type: {{ .Values.pocketbase.service.type }}
  ports:
    - name: http
      port: {{ .Values.pocketbase.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ryni.pocketbase.selectorLabels" . | nindent 4 }}
